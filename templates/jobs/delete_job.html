{% extends "base.html" %}

{% block title %}Delete Job - Job Portal{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <h2 class="fw-bold text-danger">
                        Delete Job
                    </h2>
                    <p class="mt-3">
                        Are you sure you want to delete:
                    </p>
                    <h4>
                        {{ job.title }}
                    </h4>
                    <p class="text-muted">
                        This action cannot be undone.
                    </p>
                    <form method="POST">
                        {% csrf_token %}
                        <button
                            type="submit"
                            class="btn btn-danger">
                            Yes, Delete
                        </button>
                        <a
                            href="{% url 'recruiter_jobs' %}"
                            class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
