{% extends "base.html" %}

{% block title %}
Post a Job - Job Portal
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-4">
                        Post a New Job
                    </h2>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button
                            type="submit"
                            class="btn btn-primary">
                            Post Job
                        </button>
                        <a
                            href="{% url 'recruiter_jobs' %}"
                            class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
