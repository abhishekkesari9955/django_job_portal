{% extends 'base.html' %}

{% block title %}
Apply for Job - Job Portal
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="fw-bold">
                        Apply for {{ job.title }}
                    </h2>
                    <p class="text-primary fw-bold">
                        {{ job.company }}
                    </p>
                    <hr>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Cover Letter
                            </label>
                            {{ form.cover_letter }}
                        </div>
                        <button
                            type="submit"
                            class="btn btn-primary">
                            Submit Application
                        </button>
                        <a
                            href="{% url 'job_detail' job.id %}"
                            class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
